sonar.projectKey=line-expense-bot
sonar.projectName=line-expense-bot
sonar.sourceEncoding=UTF-8

# โค้ดหลักและ test อยู่ปนกันใต้ root ของ repo จึงแยก test ด้วยชื่อไฟล์
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.js,**/*.test.mjs,**/*.spec.js,**/*.spec.mjs
sonar.exclusions=**/.env*,**/node_modules/**,coverage/**,docs/**,work-memory/**,**/*.test.js,**/*.test.mjs,**/*.spec.js,**/*.spec.mjs

# ไฟล์ coverage จาก `npm run test:coverage` (scripts/sonar-scan.ps1 รันให้ก่อนสแกนและแปลง path เป็น /)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# ไฟล์ตั้งค่า สคริปต์ dev และตัวช่วยเทสต์ไม่ได้เขียน unit test ครอบ ถ้านับจะทำให้ coverage ต่ำเกินจริง (vitest ก็ไม่นับสองตัวหลัง)
sonar.coverage.exclusions=**/*.config.*,scripts/**,public/liff/vendor/**,public/liff/dom-harness.mjs,src/db/test-helpers.mjs
