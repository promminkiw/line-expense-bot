<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการรายรับรายจ่าย</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="bar">
      <h1>รายการของฉัน</h1>
      <input type="month" id="month" aria-label="เลือกเดือน">
    </header>
    <p id="totals" class="totals" hidden></p>
    <p id="truncated" class="notice" hidden>เดือนนี้มีรายการมากกว่าที่แสดงได้ ยอดรวมและกราฟนับครบทุกรายการ ดูรายการทั้งหมดได้จาก Export CSV</p>
    <div class="export">
      <button type="button" id="export-button" disabled>Export CSV</button>
      <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
    </div>
    <section id="chart" class="chart" aria-labelledby="chart-title" hidden>
      <div class="chart-head">
        <h2 id="chart-title">สรุปตามหมวด</h2>
        <div class="tabs" role="group" aria-label="ประเภทกราฟ">
          <button type="button" data-type="expense" aria-pressed="true">รายจ่าย</button>
          <button type="button" data-type="income" aria-pressed="false">รายรับ</button>
        </div>
      </div>
      <ul id="chart-rows" class="chart-rows"></ul>
      <p id="chart-empty" class="chart-empty" hidden></p>
    </section>
    <section id="budgets" class="budgets" aria-labelledby="budgets-title" hidden>
      <h2 id="budgets-title">งบประมาณรายจ่าย</h2>
      <p class="budgets-hint">แตะหมวดเพื่อตั้งหรือแก้งบ งบมีผลตั้งแต่เดือนที่เลือกเป็นต้นไป (ไม่กระทบเดือนก่อนหน้า)</p>
      <ul id="budget-rows" class="budget-rows"></ul>
      <p id="budgets-error" class="budgets-error" hidden></p>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">กำลังโหลด...</p>
    <ul id="list" class="list"></ul>
  </main>
  <dialog id="editor">
    <form id="edit-form">
      <h2>แก้ไขรายการ</h2>
      <label>จำนวนเงิน (บาท)
        <input id="edit-amount" type="number" inputmode="decimal" step="0.01" min="0.01" max="10000000" required>
      </label>
      <label>หมวด
        <select id="edit-category" required></select>
      </label>
      <label>วันที่
        <input id="edit-date" type="date" required>
      </label>
      <label>โน้ต
        <input id="edit-note" type="text" maxlength="200">
      </label>
      <p id="edit-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" id="delete-button" class="danger">ลบ</button>
        <button type="button" id="cancel-button">ปิด</button>
        <button type="submit" class="primary">บันทึก</button>
      </div>
    </form>
  </dialog>
  <dialog id="confirm-delete" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-category" class="confirm-category"></p>
    <p id="confirm-amount" class="confirm-amount"></p>
    <p id="confirm-date" class="confirm-detail"></p>
    <p id="confirm-note" class="confirm-detail" hidden></p>
    <div class="actions">
      <button type="button" id="confirm-cancel" autofocus>ยกเลิก</button>
      <button type="button" id="confirm-ok" class="danger-solid">ลบ</button>
    </div>
  </dialog>
  <dialog id="budget-editor" aria-labelledby="budget-title">
    <form id="budget-form">
      <h2 id="budget-title"></h2>
      <p id="budget-scope" class="confirm-detail"></p>
      <label>งบต่อเดือน (บาท)
        <input id="budget-amount" type="number" inputmode="decimal" step="0.01" min="0.01" max="10000000" required>
      </label>
      <p id="budget-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" id="budget-remove" class="danger">ไม่ตั้งงบ</button>
        <button type="button" id="budget-cancel">ปิด</button>
        <button type="submit" class="primary">บันทึก</button>
      </div>
    </form>
  </dialog>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
